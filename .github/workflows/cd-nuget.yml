name: CD NuGet - Publish MotorDsl

# Publica los 9 paquetes de la libreria.
#
# Por que hay dos jobs de pack y no uno solo: `dotnet pack` de un proyecto multi-TFM exige
# compilar TODOS sus TFM. MotorDsl.Bluetooth y MotorDsl.Maui declaran net10.0-android;net10.0-ios,
# y el workload `ios` NO EXISTE para Linux — `dotnet workload install ios` responde
# "Workload ID ios isn't supported on this platform" y el build corta con NETSDK1178. Por eso
# esos dos paquetes solo pueden empaquetarse en macOS, mientras que los otros seis son net10.0
# puro y salen de ubuntu-latest. MotorDsl.Pax (net10.0-android) va tambien en macOS porque ese
# runner ya instala la workload android.
#
# Runners: todos son de GitHub. El repositorio es publico y sus minutos no se cobran; version,
# pack-managed y publish no usan nada propio de un runner self-hosted (el NUGET_API_KEY es un
# secreto del repositorio), y en la cola compartida del self-hosted hacian fila detras de otros repos.
#
# MotorDsl.Pax sale SIN el binding NeptuneLite: el jar y las .so del SDK PAX no se versionan
# (no hay licencia de redistribucion), asi que el csproj compila con PaxNeptune=false y el modo
# Real cae en Connection. Se fuerza -p:PaxNeptune=false para que no dependa de la deteccion.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej: 1.0.0)'
        required: true

env:
  DOTNET_VERSION: '10.0.102'

jobs:
  # ── Version unica para los 9 paquetes ────────────────────────────────────────
  # Se resuelve una sola vez y se propaga por outputs. Los 9 comparten numero para
  # evitar NU1605 (downgrade de dependencia) en apps que mezclen varios.
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: Determinar versión
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="0.0.0-preview.${{ github.run_number }}"
          fi
          echo "package_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión a publicar: $VERSION"

  # ── Los 6 paquetes net10.0 ───────────────────────────────────────────────────
  pack-managed:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET en un directorio propio del job: la imagen ubuntu-latest (26.04) trae el SDK 11 en
      # /usr/share/dotnet y, sin global.json, `dotnet` usaria el SDK mas nuevo y no DOTNET_VERSION.
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: SDK en uso
        run: dotnet --list-sdks && dotnet --version

      - name: Restore
        run: |
          for proj in Core Parser Rendering Extensions Printing.Abstractions Network; do
            dotnet restore src/MotorDsl.$proj/MotorDsl.$proj.csproj
          done

      - name: Build Release
        run: |
          for proj in Core Parser Rendering Extensions Printing.Abstractions Network; do
            dotnet build src/MotorDsl.$proj/MotorDsl.$proj.csproj -c Release --no-restore
          done

      - name: Tests
        run: |
          dotnet restore src/MotorDsl.Tests/MotorDsl.Tests.csproj
          dotnet test src/MotorDsl.Tests/MotorDsl.Tests.csproj -c Release

      - name: Pack los 6 proyectos net10.0
        run: |
          for proj in Core Parser Rendering Extensions Printing.Abstractions Network; do
            dotnet pack src/MotorDsl.$proj/MotorDsl.$proj.csproj \
              -c Release \
              --no-build \
              -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
              -p:PackageReleaseNotes="Release ${{ env.PACKAGE_VERSION }}" \
              -o ./nupkg
          done
          ls -la ./nupkg/

      - name: Subir paquetes managed
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-managed
          path: ./nupkg/*.nupkg
          retention-days: 1

  # ── Los 3 paquetes con TFM de plataforma ─────────────────────────────────────
  # Requiere macOS: es la unica plataforma donde conviven los workloads ios y android.
  pack-platform:
    needs: version
    runs-on: macos-15
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar workloads de plataforma
        run: dotnet workload install ios android maui-android

      - name: Restore
        run: |
          for proj in Bluetooth Maui Pax; do
            dotnet restore src/MotorDsl.$proj/MotorDsl.$proj.csproj
          done

      - name: Build Release
        run: |
          for proj in Bluetooth Maui Pax; do
            dotnet build src/MotorDsl.$proj/MotorDsl.$proj.csproj -c Release --no-restore -p:PaxNeptune=false
          done

      - name: Pack los 3 proyectos de plataforma
        run: |
          for proj in Bluetooth Maui Pax; do
            dotnet pack src/MotorDsl.$proj/MotorDsl.$proj.csproj \
              -c Release \
              --no-build \
              -p:PaxNeptune=false \
              -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
              -p:PackageReleaseNotes="Release ${{ env.PACKAGE_VERSION }}" \
              -o ./nupkg
          done
          ls -la ./nupkg/

      - name: Subir paquetes de plataforma
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-platform
          path: ./nupkg/*.nupkg
          retention-days: 1

  # ── Publicacion ──────────────────────────────────────────────────────────────
  publish:
    needs: [version, pack-managed, pack-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}

    steps:
      # .NET en un directorio propio del job: la imagen ubuntu-latest (26.04) trae el SDK 11 en
      # /usr/share/dotnet y, sin global.json, `dotnet` usaria el SDK mas nuevo y no DOTNET_VERSION.
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: SDK en uso
        run: dotnet --list-sdks && dotnet --version

      - name: Bajar los paquetes de ambos jobs
        uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          merge-multiple: true
          path: ./nupkg

      - name: Verificar que estén los 9
        run: |
          ls -la ./nupkg/
          COUNT=$(ls -1 ./nupkg/*.nupkg | wc -l)
          if [ "$COUNT" -ne 9 ]; then
            echo "::error::Se esperaban 9 paquetes y hay $COUNT. No se publica un conjunto incompleto."
            exit 1
          fi

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Orden de dependencias: Printing.Abstractions primero, los consumidores despues.
          for proj in Printing.Abstractions Core Parser Rendering Extensions Network Bluetooth Maui Pax; do
            dotnet nuget push "./nupkg/MotorDsl.$proj.${{ env.PACKAGE_VERSION }}.nupkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ env.PACKAGE_VERSION }}
          path: ./nupkg/*.nupkg
          retention-days: 30
