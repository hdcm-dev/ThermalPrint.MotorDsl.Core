name: CI - Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.102'

jobs:
  test:
    # Runner de GitHub: el repositorio es público y sus minutos no se cobran. El job no usa nada
    # propio del runner self-hosted (sin docker.sock, dispositivos, red interna ni secretos de
    # infraestructura), y en la cola compartida del self-hosted esperaba hasta 1 h 36 min.
    runs-on: ubuntu-latest
    name: MotorDsl.Tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # .NET en un directorio propio del job: la imagen ubuntu-latest (26.04) trae el SDK 11 en
    # /usr/share/dotnet y, sin global.json, `dotnet` usaria el SDK mas nuevo y no DOTNET_VERSION.
    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: SDK en uso
      run: dotnet --list-sdks && dotnet --version

    - name: Restore
      run: dotnet restore src/MotorDsl.Tests/MotorDsl.Tests.csproj

    - name: Build
      run: dotnet build src/MotorDsl.Tests/MotorDsl.Tests.csproj -c Release --no-restore

    - name: Test
      run: |
        dotnet test src/MotorDsl.Tests/MotorDsl.Tests.csproj \
          -c Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./TestResults \
          --verbosity minimal

    - name: Subir resultados como artefacto
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_number }}
        path: ./TestResults/*.trx
        retention-days: 7

    - name: Comentar PR si falla
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ **CI falló** — Los tests unitarios no pasaron en este PR.\n\n' +
                  'Proyecto: `PrintThermalDriver.slnx` | Target: 0 errores.\n\n' +
                  'Ver los [logs de Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) para más detalles.'
          })
